name: Cloud daily recommendations

run-name: Daily ${{ github.event_name == 'workflow_dispatch' && format('manual {0}', inputs.runDate) || 'scheduled' }}

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      runDate:
        description: "UTC business date YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate date and reject duplicate active runs
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_date: ${{ steps.guard.outputs.run_date }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate production fallback request
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_DATE: ${{ inputs.runDate }}
        run: node scripts/daily-workflow-guard.mjs

  daily:
    name: Run persisted cloud daily pipeline
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: daily-paper-cloud-${{ github.repository }}-production-${{ needs.preflight.outputs.run_date }}
      cancel-in-progress: false
      queue: max
    env:
      DEPLOYMENT_MODE: cloud
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ZOTERO_TRANSPORT: web
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      OBSIDIAN_ENABLED: "false"
      SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
      NOTIFICATION_DASHBOARD_URL: ${{ vars.NOTIFICATION_DASHBOARD_URL }}
      WECOM_BOT_WEBHOOK_URL: ${{ secrets.WECOM_BOT_WEBHOOK_URL }}
      NOTIFICATION_SMTP_HOST: ${{ secrets.NOTIFICATION_SMTP_HOST }}
      NOTIFICATION_SMTP_PORT: ${{ secrets.NOTIFICATION_SMTP_PORT }}
      NOTIFICATION_SMTP_SECURE: ${{ secrets.NOTIFICATION_SMTP_SECURE }}
      NOTIFICATION_SMTP_USER: ${{ secrets.NOTIFICATION_SMTP_USER }}
      NOTIFICATION_SMTP_PASS: ${{ secrets.NOTIFICATION_SMTP_PASS }}
      NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_SMTP_FROM }}
      NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_SMTP_TO }}
      DAILY_PRODUCTION_RESULT_PATH: artifacts/daily-production-result-v1.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate cloud configuration
        run: npm run check:env

      - name: Validate PostgreSQL schema
        run: npm run prisma:cloud:validate

      - name: Generate PostgreSQL Prisma Client
        run: npm run prisma:cloud:generate

      - name: Check persisted business run before migration
        id: persisted
        shell: bash
        env:
          RUN_DATE: ${{ needs.preflight.outputs.run_date }}
        run: |
          set -o pipefail
          npm run job:daily:guard -- --run-date "$RUN_DATE" \
            | node scripts/daily-production-evidence.mjs \
                --output "$DAILY_PRODUCTION_RESULT_PATH" \
                --business-date "$RUN_DATE"

      - name: Deploy PostgreSQL migrations
        if: steps.persisted.outputs.run_migration == 'true'
        run: npm run prisma:cloud:migrate:deploy

      - name: Run daily pipeline
        if: steps.persisted.outputs.run_daily_job == 'true'
        shell: bash
        env:
          RUN_DATE: ${{ needs.preflight.outputs.run_date }}
        run: |
          set -o pipefail
          npm run job:daily:cloud -- --run-date "$RUN_DATE" \
            | node scripts/daily-production-evidence.mjs \
                --output "$DAILY_PRODUCTION_RESULT_PATH" \
                --business-date "$RUN_DATE"

      - name: Upload redacted production result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-production-result-v1-${{ github.run_attempt }}
          path: artifacts/daily-production-result-v1.json
          if-no-files-found: warn
          retention-days: 14
