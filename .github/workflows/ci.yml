name: Secret-free continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-paper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Git history and source for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Validate, test, and build from a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify pristine checkout
        run: node scripts/ci-clean-checkout.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Audit production dependencies against frozen baseline
        run: node scripts/production-audit-check.mjs

      - name: Test configuration and workflow contracts
        run: |
          npm run test:config
          node --test scripts/production-db-health.test.mjs
          node --test scripts/daily-workflow.test.mjs scripts/profile-workflow.test.mjs scripts/cloudflare-contract.test.mjs scripts/cloudflare-artifact-contract.test.mjs scripts/cloudflare-final-bundle-contract.test.mjs scripts/ci-migration-check.test.mjs scripts/ci-workflow-contract.test.mjs scripts/production-audit-check.test.mjs

      - name: Validate Local Mode contracts
        env:
          DEPLOYMENT_MODE: local
          DATABASE_URL: file:./ci-validation.db
          ZOTERO_TRANSPORT: local
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: |
          npm run check:env
          npm run prisma:local:validate

      - name: Validate Cloud Mode contracts
        env:
          DEPLOYMENT_MODE: cloud
          DATABASE_URL: postgresql://placeholder:placeholder@database.invalid/daily_paper
          ZOTERO_TRANSPORT: web
          ZOTERO_ID: placeholder-library
          ZOTERO_KEY: placeholder-api-key
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: |
          npm run check:env
          npm run prisma:cloud:validate

      - name: Validate database contracts
        env:
          DEPLOYMENT_MODE: local
          DATABASE_URL: file:./ci-validation.db
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: npm run test:db-contract

      - name: Type-check application
        env:
          DEPLOYMENT_MODE: local
          DATABASE_URL: file:./ci-validation.db
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: npm run typecheck

      - name: Run application tests
        env:
          DEPLOYMENT_MODE: local
          DATABASE_URL: file:./ci-validation.db
          ZOTERO_TRANSPORT: local
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: npm test

      - name: Build production application artifact
        env:
          DEPLOYMENT_MODE: local
          DATABASE_URL: file:./ci-validation.db
          ZOTERO_TRANSPORT: local
          OBSIDIAN_ENABLED: "false"
          SCHEDULER_DESKTOP_NOTIFICATION_ENABLED: "false"
        run: npm run build

      - name: Verify commands preserve tracked checkout
        run: node scripts/ci-clean-checkout.mjs

  migration:
    name: Validate PostgreSQL migrations on an ephemeral database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: daily_paper_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d daily_paper_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Deploy and compare migrations on the CI database
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/daily_paper_ci
        run: node scripts/ci-migration-check.mjs

      - name: Generate Prisma clients for PostgreSQL integration tests
        run: npm run prisma:generate:all

      - name: Test read-only health on the disposable database
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/daily_paper_ci
        run: node --test scripts/production-db-health.test.mjs

      - name: Test bulk persistence and profile replacement on PostgreSQL
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/daily_paper_ci
        run: >-
          npx vitest run
          src/db/repositories/candidate-normalization-postgresql.integration.test.ts
          src/db/repositories/ranking-result-persistence-postgresql.integration.test.ts
          src/db/repositories/profile-snapshot-postgresql.integration.test.ts
          --pool=threads

      - name: Verify commands preserve tracked checkout
        run: node scripts/ci-clean-checkout.mjs
