name: Cloudflare Worker preview contract

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit to build for a controlled release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-paper-workerd-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and smoke-test workerd on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOYMENT_MODE: cloud
      DAILY_PAPER_RUNTIME_TARGET: cloudflare
      NEXT_PUBLIC_DEPLOYMENT_MODE: cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .build-home/release-tools
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate Worker contracts
        run: >-
          node --test
          scripts/cloudflare-contract.test.mjs
          scripts/cloudflare-artifact-contract.test.mjs
          scripts/cloudflare-final-bundle-contract.test.mjs

      - name: Validate release orchestration and workflow contracts
        run: node --test .build-home/release-tools/scripts/worker-release.test.mjs .build-home/release-tools/scripts/worker-release-workflow.test.mjs

      - name: Type-check application and Worker
        run: npm run typecheck

      - name: Run application regression tests with disposable fixtures
        shell: bash
        run: env -u DATABASE_URL DEPLOYMENT_MODE=local npm test

      - name: Build OpenNext Worker
        shell: bash
        run: env -u DATABASE_URL npm run cf:build

      - name: Validate generated Worker bundle
        run: node scripts/cloudflare-artifact-contract.mjs

      - name: Bundle custom Worker without deploying
        run: npm run cf:dry-run

      - name: Scan final custom Worker bundle for secrets
        run: npm run cf:secret-scan

      - name: Package exact scanned bytes for release without build hooks
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node .build-home/release-tools/scripts/worker-release-artifact.mjs

      - name: Validate upload package without authentication or remote writes
        run: npx wrangler versions upload --dry-run --config dist/worker-release/wrangler.json --no-bundle

      - name: Start workerd and run HTTP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          env -u DATABASE_URL npx wrangler dev --local --port 8787 --config dist/worker-release/wrangler.json \
            --persist-to "$RUNNER_TEMP/worker-smoke-state" \
            --var DEPLOYMENT_MODE:cloud \
            --var DAILY_PAPER_RUNTIME_TARGET:cloudflare \
            --var NEXT_PUBLIC_DEPLOYMENT_MODE:cloud \
            --var TEAM_DOMAIN:https://ci.cloudflareaccess.com \
            --var POLICY_AUD:ci-audience \
            --var ACCESS_ALLOWED_EMAIL:ci-user@example.invalid \
            > "$RUNNER_TEMP/workerd.log" 2>&1 &
          workerd_pid=$!
          trap 'kill "$workerd_pid" 2>/dev/null || true; wait "$workerd_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://localhost:8787 node scripts/cloudflare-preview-smoke.mjs

      - name: Verify smoke preserved the complete immutable payload
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node .build-home/release-tools/scripts/worker-release-artifact.mjs verify

      - name: Upload verified Worker bundle
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-worker-${{ github.sha }}
          path: .open-next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload immutable release payload
        uses: actions/upload-artifact@v7
        with:
          name: worker-release-${{ inputs.source_sha || github.sha }}
          path: dist/worker-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload workerd log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workerd-preview-log
          path: ${{ runner.temp }}/workerd.log
          if-no-files-found: ignore
          retention-days: 7
